<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | NOIRÉ</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f7f6f2;
            font-family: Arial, sans-serif;
        }

        .reset-container {
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            background: white;
            border: 1px solid #e5e3dc;
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(0,0,0,.06);
        }

        .logo {
            text-align: center;
            font-family: Georgia, serif;
            font-size: 32px;
            letter-spacing: 5px;
            margin-bottom: 30px;
        }

        h1 {
            text-align: center;
            font-size: 23px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 9px;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 13px;
            margin-bottom: 20px;
            border: 1px solid #deddd8;
            border-radius: 9px;
            outline: none;
        }

        input:focus {
            border-color: #171717;
        }

        button {
            width: 100%;
            height: 49px;
            border: none;
            border-radius: 9px;
            background: #171717;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

                /* PASSWORD SHOW / HIDE */

        .password-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
        }

        .password-wrapper input {
            padding-right: 48px;
            margin-bottom: 0;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            color: #777;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .password-toggle svg {
            width: 19px;
            height: 19px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="reset-container">

        <div class="logo">NOIRÉ</div>

        <h1>Reset Password</h1>

        <p class="subtitle">
            Create a new password for your account.
        </p>

        <form id="reset-form">

            <label for="new-password">NEW PASSWORD</label>

<div class="password-wrapper">
    <input
        type="password"
        id="new-password"
        minlength="8"
        placeholder="Enter new password"
        required
    >

    <button type="button" class="password-toggle"
        data-target="new-password" aria-label="Show password">
        <svg viewBox="0 0 24 24">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
            <circle cx="12" cy="12" r="3"/>
        </svg>
    </button>
</div>

           <label for="confirm-password">CONFIRM PASSWORD</label>

<div class="password-wrapper">
    <input
        type="password"
        id="confirm-password"
        minlength="8"
        placeholder="Confirm new password"
        required
    >

    <button type="button" class="password-toggle"
        data-target="confirm-password" aria-label="Show password">
        <svg viewBox="0 0 24 24">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
            <circle cx="12" cy="12" r="3"/>
        </svg>
    </button>
</div>

            <button type="submit" id="reset-btn">
                UPDATE PASSWORD
            </button>

            <p id="message" role="status"></p>

        </form>

    </div>

   
<script>
    const SUPABASE_URL =
        "https://ygpmnhhqhcoyivrxwngw.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_-hJcIeoHdieoniCwu4AOAg_TqPg993e";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    const resetForm = document.getElementById("reset-form");
    const resetBtn = document.getElementById("reset-btn");
    const message = document.getElementById("message");

    let recoveryReady = false;

    // CHECK PASSWORD RECOVERY SESSION
    supabaseClient.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY" && session) {
            recoveryReady = true;
            message.style.color = "#16803c";
            message.textContent = "Enter your new password.";
        }
    });

    // CHECK EXISTING SESSION AFTER PAGE LOAD
    async function checkRecoverySession() {
        const { data, error } =
            await supabaseClient.auth.getSession();

        if (!error && data.session) {
            recoveryReady = true;
            message.style.color = "#16803c";
            message.textContent = "Enter your new password.";
        } else {
            message.style.color = "#d93025";
            message.textContent =
                "Reset session not found. Please request a new password reset link.";
        }
    }

    checkRecoverySession();

        // PASSWORD SHOW / HIDE

    document.querySelectorAll(".password-toggle").forEach(button => {
        button.addEventListener("click", function() {

            const passwordInput =
                document.getElementById(this.dataset.target);

            if (passwordInput.type === "password") {

                passwordInput.type = "text";
                this.setAttribute("aria-label", "Hide password");

                this.innerHTML = `
                    <svg viewBox="0 0 24 24">
                        <path d="M3 3l18 18"/>
                        <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
                        <path d="M9.9 5.2A11 11 0 0 1 12 5c6.5 0 10 7 10 7a15 15 0 0 1-4 4.5"/>
                        <path d="M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7a10 10 0 0 0 3-.5"/>
                    </svg>
                `;

            } else {

                passwordInput.type = "password";
                this.setAttribute("aria-label", "Show password");

                this.innerHTML = `
                    <svg viewBox="0 0 24 24">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                `;
            }
        });
    });

    // UPDATE PASSWORD
    resetForm.addEventListener("submit", async function(e) {
        e.preventDefault();

        const password =
            document.getElementById("new-password").value;

        const confirmPassword =
            document.getElementById("confirm-password").value;

        if (!recoveryReady) {
            message.style.color = "#d93025";
            message.textContent =
                "Please open a valid password reset link first.";
            return;
        }

        if (password.length < 8) {
            message.style.color = "#d93025";
            message.textContent =
                "Password must be at least 8 characters.";
            return;
        }

        if (password !== confirmPassword) {
            message.style.color = "#d93025";
            message.textContent = "Passwords do not match.";
            return;
        }

        resetBtn.disabled = true;
        resetBtn.textContent = "UPDATING...";

        try {
            const { error } =
                await supabaseClient.auth.updateUser({
                    password: password
                });

           if (error) throw error;

message.style.color = "#16803c";
message.textContent =
    "Password updated successfully! Redirecting to NOIRÉ...";

resetBtn.textContent = "PASSWORD UPDATED";

setTimeout(() => {
    window.location.replace("index.html");
}, 1800);
        } catch(error) {
            message.style.color = "#d93025";
            message.textContent = error.message;

            resetBtn.disabled = false;
            resetBtn.textContent = "UPDATE PASSWORD";
        }
    });
</script>


</body>
</html>
